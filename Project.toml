# XMLSig and Keystore ccall into libxml2 and libcrypto through EzXML's and
# OpenSSL.jl's internals (`libxml2`, `_Node`, `libcrypto`, `EvpPKey`), which
# are not part of either package's public API. Upper bounds are load-bearing:
# a minor release that renames one of those breaks signing, not compilation.
[compat]
CodecZlib = "0.7"
EzXML = "1.2"
OpenSSL = "1.6"
julia = "1.12"   # the version the suite is verified on; earlier 1.x is untested
